services:
  backend:
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    env_file:
      - ./src/backend/.env
    volumes:
      - ./src/backend/app:/app/app
      - ./src/backend/prompts:/app/prompts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
